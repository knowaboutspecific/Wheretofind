<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playbound – Free browser games</title>
<meta name="description" content="Free-to-play browser games from an independent studio. No downloads, no accounts.">
<meta name="theme-color" content="#0f1220">
<meta property="og:title" content="Playbound">
<meta property="og:description" content="Free-to-play browser games. No downloads, no accounts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1220'/%3E%3Cpath d='M16 5l9 11-9 11-9-11z' fill='%23f2a65a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --h{syntax:"<number>";inherits:true;initial-value:18}
:root{--h:18;--bg:#0f1220;--panel:#171b2f;--line:#2a3050;--text:#eef0f8;--muted:#a3abc8;
--cut:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));
--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;color-scheme:dark;transition:--h .7s ease}
:is(:root,.card,.tile,dialog){--acc:hsl(var(--h) 85% 62%);--ink:hsl(var(--h) 60% 8%)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--text);font:400 1rem/1.6 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px}.skip:focus{left:1rem;top:1rem;background:#fff;color:#000;padding:.5rem 1rem;z-index:9}
h1,h2,h3{font-family:var(--display);line-height:1;letter-spacing:-.01em}
section{padding:4.5rem 0}
.sec{font-size:clamp(2rem,4vw,2.75rem)}

.nav{position:sticky;top:0;z-index:5;background:rgb(15 18 32/.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
